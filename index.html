<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>АЛЯРМ!</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: radial-gradient(circle at 50% 20%, #1a1a2e 0%, #0a0a12 70%);
    background-attachment: fixed;
    color: #f5f5f5;
    font-family: 'Trebuchet MS', 'Segoe UI', Arial, sans-serif;
  }
  .wrap {
    text-align: center;
    padding: 36px 16px 60px;
    max-width: 480px;
    margin: 0 auto;
  }
  .alarm {
    margin: 0;
    font-size: 2.6rem;
    font-weight: 900;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #ff2a2a;
    text-shadow: 0 0 18px rgba(255, 42, 42, 0.8);
    animation: blink 0.8s steps(1) infinite;
  }
  @keyframes blink {
    50% { color: #ffd166; text-shadow: 0 0 18px rgba(255, 209, 102, 0.8); }
  }
  .siren {
    font-size: 2rem;
    display: inline-block;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin {
    0%, 100% { transform: rotate(-15deg); }
    50% { transform: rotate(15deg); }
  }
  .headline {
    margin: 18px 0 26px;
    font-size: 1.35rem;
    line-height: 1.4;
    color: #f5f5f5;
  }
  .headline b {
    background: linear-gradient(90deg, #ffd166, #f77f00);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-transform: uppercase;
  }
  .poster {
    background: #e9d8a6;
    color: #3b2a14;
    padding: 18px 18px 22px;
    border-radius: 6px;
    box-shadow: 0 0 40px rgba(255, 42, 42, 0.35), 0 10px 30px rgba(0,0,0,0.6);
    transform: rotate(-1.5deg);
  }
  .poster .wanted {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: clamp(1.3rem, 7vw, 2rem);
    font-weight: 900;
    letter-spacing: 2px;
    margin: 0 0 12px;
  }
  .poster img {
    width: 100%;
    display: block;
    border: 4px solid #3b2a14;
    background: #c9b88a;
    min-height: 200px;
  }
  .poster .reward {
    margin: 12px 0 0;
    font-family: Georgia, 'Times New Roman', serif;
    font-weight: bold;
    letter-spacing: 1px;
  }
  .run {
    margin: 34px 0 0;
    font-size: 2rem;
    font-weight: 900;
    text-transform: uppercase;
    color: #ff2a2a;
    text-shadow: 0 0 18px rgba(255, 42, 42, 0.8);
    animation: shake 0.4s infinite;
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-4px); }
    75% { transform: translateX(4px); }
  }
</style>
</head>
<body>
  <div class="wrap">
    <div><span class="siren">🚨</span> <span class="siren">🚨</span> <span class="siren">🚨</span></div>
    <h1 class="alarm">Алярм, алярм!</h1>

    <!-- ТЕКСТ ПРО БЕГЛЕЦА: меняй тут -->
    <p class="headline">Сбежал <b>главный бандит Румынии</b>!</p>

    <div class="poster">
      <p class="wanted">РАЗЫСКИВАЕТСЯ</p>
      <!-- ФОТО: загрузи фото в репозиторий с именем photo.jpg -->
      <img src="photo.jpg" alt="Разыскивается">
      <p class="reward">Награды не будет</p>
    </div>

    <p class="run">Если увидите — бегите!</p>

  </div>
</body>
</html>
