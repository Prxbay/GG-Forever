<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GG Forever</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: radial-gradient(circle at 50% 20%, #1a1a2e 0%, #0a0a12 70%);
    color: #f5f5f5;
    font-family: 'Trebuchet MS', 'Segoe UI', Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .wrap {
    text-align: center;
    padding: 24px;
    max-width: 480px;
  }
  video {
    width: 100%;
    max-width: 320px;
    border-radius: 18px;
    box-shadow: 0 0 40px rgba(140, 90, 255, 0.35), 0 0 0 1px rgba(255,255,255,0.06);
    display: block;
    margin: 0 auto;
  }
  h1 {
    margin: 28px 0 6px;
    font-size: 2rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    background: linear-gradient(90deg, #ffd166, #f77f00);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: none;
  }
  p.sub {
    margin: 0;
    font-size: 1.1rem;
    color: #b8b8c8;
    letter-spacing: 0.5px;
  }
  p.sub b {
    color: #f5f5f5;
  }
</style>
</head>
<body>
  <div class="wrap">
    <video autoplay loop muted playsinline>
      <source src="GG_Forever.mp4" type="video/mp4">
    </video>
    <h1>GG Forever</h1>
    <p class="sub">From <b>Probay</b> to <b>Starkiller</b></p>
  </div>
</body>
</html>
